apiVersion: v1alpha1
kind: Setting
metadata:
  name: Ethereal-setting
spec:
  forms:
    - group: base
      label: 基础设置
      formSchema:
        - $formkit: group
          name: banner
          label: Banner
          value:
            enable: true
            mode: single
            src: "/themes/Ethereal/assets/images/demo-banner.png"
            carousel:
              images: []
              effect: fade
              dots: true
              preloadCount: 1
              dwellMs: 5000
            position: "center"
            credit:
              enable: false
              text: "© 2022 Ethereal"
              url: ""
          children:
            - $formkit: switch
              name: enable
              id: banner_enable
              label: 启用
              value: true
              help: "启用横幅"
            - $formkit: select
              name: mode
              id: banner_mode
              if: "$get(banner_enable).value"
              label: 类型
              value: single
              help: "单图/视频：显示一张图片或视频，按文件类型自动识别；多图轮播：多张静态图片循环切换"
              options:
                - label: 单图/视频
                  value: single
                - label: 多图轮播
                  value: carousel
            - $formkit: attachment
              name: src
              id: banner_src
              key: banner_src
              if: "$get(banner_enable).value && $get(banner_mode).value === 'single'"
              label: 图片/视频
              value: "/themes/Ethereal/assets/images/demo-banner.png"
              accepts:
                - "image/*"
                - "video/mp4"
                - "video/webm"
              help: "支持图片（含 GIF/WebP/APNG 动图）与视频（MP4/WebM，静音循环播放）"
            - $formkit: group
              name: carousel
              id: banner_carousel
              key: banner_carousel
              if: "$get(banner_enable).value && $get(banner_mode).value === 'carousel'"
              label: 轮播设置
              value:
                images: []
                effect: fade
                dots: true
                preloadCount: 1
                dwellMs: 5000
              children:
                - $formkit: attachment
                  name: images
                  id: carousel_images
                  key: carousel_images
                  label: 轮播图片
                  multiple: true
                  accepts:
                    - "image/*"
                  value: []
                  help: "选择多张静态图片，按顺序循环切换；少于 2 张时按单图显示。支持外部链接，重复链接会自动附加查询参数强制单独请求；随机图接口建议使用无状态服务（uapis.cn 等接口存在同一浏览器会话内反复请求返回同一张图的问题"
                - $formkit: select
                  name: effect
                  label: 切换效果
                  value: fade
                  options:
                    - label: 淡入淡出
                      value: fade
                    - label: 左右滑动
                      value: slide
                - $formkit: switch
                  name: dots
                  label: 显示指示点
                  value: true
                  help: "在右下角显示可点击的指示点，点击可跳转到对应图片"
                - $formkit: number
                  name: preloadCount
                  label: 预加载数量
                  min: 0
                  max: 10
                  step: 1
                  value: 1
                  help: "预加载当前图片之后的 N 张，0 表示不预加载"
                - $formkit: number
                  name: dwellMs
                  label: 停留时长（毫秒）
                  min: 1000
                  max: 60000
                  step: 500
                  value: 5000
                  help: "每张图片停留时长（毫秒），独立配置，不随动画速度档位变化；切换动画时长仍跟随动画速度档位"
            - $formkit: switch
              name: useMobileSrc
              id: banner_useMobileSrc
              if: "$get(banner_enable).value"
              label: 移动端独立来源
              value: false
              help: "开启后为移动端（小于 768px）单独设置 banner 视频/图片来源；关闭时两端共用同一来源"
            - $formkit: group
              name: mobile
              id: banner_mobile
              key: banner_mobile
              if: "$get(banner_enable).value && $get(banner_useMobileSrc).value"
              label: 移动端设置
              value:
                mode: single
                src: ""
                images: []
              children:
                - $formkit: select
                  name: mode
                  id: banner_mobile_mode
                  label: 类型（移动端）
                  value: single
                  help: "移动端展示形态，可与电脑端不同（如电脑端视频、移动端图片）；行为设置（切换效果/指示点/停留时长/位置等）沿用电脑端"
                  options:
                    - label: 单图/视频
                      value: single
                    - label: 多图轮播
                      value: carousel
                - $formkit: attachment
                  name: src
                  id: banner_mobile_src
                  key: banner_mobile_src
                  if: "$get(banner_enable).value && $get(banner_useMobileSrc).value && $get(banner_mobile_mode).value === 'single'"
                  label: 图片/视频（移动端）
                  value: ""
                  accepts:
                    - "image/*"
                    - "video/mp4"
                    - "video/webm"
                  help: "移动端单图/视频；留空则移动端使用电脑端来源"
                - $formkit: attachment
                  name: images
                  id: banner_mobile_images
                  key: banner_mobile_images
                  if: "$get(banner_enable).value && $get(banner_useMobileSrc).value && $get(banner_mobile_mode).value === 'carousel'"
                  label: 轮播图片（移动端）
                  multiple: true
                  accepts:
                    - "image/*"
                  value: []
                  help: "移动端轮播图片，按顺序循环切换；留空则移动端使用电脑端来源。外部随机图接口建议使用无状态服务，uapis.cn 等接口存在同会话返回同一张图的问题"
            - $formkit: select
              name: position
              if: "$get(banner_enable).value"
              label: 位置
              value: "center"
              options:
                - value: center
                  label: 居中
                - value: top
                  label: 顶部
                - value: bottom
                  label: 底部
            - $formkit: group
              name: credit
              if: "$get(banner_enable).value"
              label: 版权信息
              children:
                - $formkit: switch
                  name: enable
                  label: 启用
                  value: false
                  help: "启用版权信息"
                - $formkit: text
                  name: text
                  label: 文字
                  value: "© 2022 Ethereal"
                  help: "显示的文字"
                - $formkit: url
                  name: url
                  label: 链接
                  value:
        - $formkit: group
          name: bannerText
          if: "$get(banner_enable).value"
          label: 标题与副标题
          value:
            enable: true
            title: "Hello,Ethereal!"
            titleFontSize: "3.5rem"
            subtitles: "生而为人，爱而无畏\n心之所向，素履以往\n保持热爱，奔赴山海"
            subtitleFontSize: "1.5rem"
            subtitleEffect: "typewriter"
          children:
            - $formkit: switch
              name: enable
              id: bannerText_enable
              label: 启用
              value: true
              help: "在 Banner 上显示标题和副标题"
            - $formkit: text
              name: title
              if: "$get(bannerText_enable).value"
              label: 标题
              value: "Hello,Ethereal!"
              help: "Banner 中间显示的标题文字"
            - $formkit: text
              name: titleFontSize
              if: "$get(bannerText_enable).value"
              label: 标题字号
              value: "3.5rem"
              help: "标题字体大小，支持 CSS 单位（如 3.5rem、48px）"
            - $formkit: textarea
              name: subtitles
              if: "$get(bannerText_enable).value"
              label: 副标题
              value: "生而为人，爱而无畏\n心之所向，素履以往\n保持热爱，奔赴山海"
              help: "每行一条文本，将循环展示"
            - $formkit: text
              name: subtitleFontSize
              if: "$get(bannerText_enable).value"
              label: 副标题字号
              value: "1.5rem"
              help: "副标题字体大小，支持 CSS 单位（如 1.5rem、20px）"
            - $formkit: select
              name: subtitleEffect
              if: "$get(bannerText_enable).value"
              label: 副标题动效
              value: "typewriter"
              options:
                - value: typewriter
                  label: 打字机效果
                - value: drop
                  label: 文字下坠
        - $formkit: group
          name: animationSpeed
          label: 动画速度
          value:
            speedTier: balanced
          children:
            - $formkit: select
              name: speedTier
              id: speedTier
              label: 速度档位
              value: balanced
              help: "舒缓：保留完整错峰入场演出；均衡：当前主题原值；疾速：入场只做轻微位移、内容立即可见（换页时长随之缩短）；自定义：手动逐项设置各动画时长（不涉及主题切换动画，其仍随缓动曲线匹配）"
              options:
                - label: 舒缓
                  value: relaxed
                - label: 均衡
                  value: balanced
                - label: 疾速
                  value: snappy
                - label: 自定义
                  value: custom
            - $formkit: group
              name: speedCustom
              if: "$get(speedTier).value === 'custom'"
              label: 自定义动画时长
              help: "仅在速度档位选择「自定义」时展示；单位毫秒"
              value:
                swup: 200
                entry: 300
                entryStep: 50
                entryMax: 400
                contentDelay: 150
                scroll: 700
                float: 350
                banner: 700
                carouselTransition: 700
              children:
                - $formkit: number
                  name: swup
                  label: 换页退场（ms）
                  min: 0
                  max: 1000
                  step: 10
                  value: 200
                  help: "页面切换时旧内容淡出下移的时长（原 200ms）"
                - $formkit: number
                  name: entry
                  label: 入场动画（ms）
                  min: 0
                  max: 1000
                  step: 10
                  value: 300
                  help: "换页后新内容 fade-in-up 时长（原 300ms）"
                - $formkit: number
                  name: entryStep
                  label: 错峰步长（ms）
                  min: 0
                  max: 200
                  step: 10
                  value: 50
                  help: "列表/组件逐项入场的递增值（原 50ms），0 表示无错峰"
                - $formkit: number
                  name: entryMax
                  label: 错峰上限（ms）
                  min: 0
                  max: 1000
                  step: 10
                  value: 400
                  help: "入场延迟最大值（原 banner-credit 400ms），错峰超过此值被截断"
                - $formkit: number
                  name: contentDelay
                  label: 内容基础延迟（ms）
                  min: 0
                  max: 1000
                  step: 10
                  value: 150
                  help: "内容主区块的入场延迟（原 --content-delay 150ms）"
                - $formkit: number
                  name: scroll
                  label: 导航栏隐藏（ms）
                  min: 0
                  max: 2000
                  step: 50
                  value: 700
                  help: "下滑隐藏导航栏的时长（原 700ms）"
                - $formkit: number
                  name: float
                  label: 浮动按钮位移（ms）
                  min: 0
                  max: 1000
                  step: 10
                  value: 350
                  help: "回顶/首页/评论浮动按钮位移动画时长（原 350ms）"
                - $formkit: number
                  name: banner
                  label: Banner 载入（ms）
                  min: 0
                  max: 2000
                  step: 50
                  value: 700
                  help: "首屏 banner 图载入渐显时长（原 700ms）"
                - $formkit: number
                  name: carouselTransition
                  label: 轮播切换（ms）
                  min: 0
                  max: 2000
                  step: 10
                  value: 700
                  help: "轮播图切换动画时长（原 700ms），随动画速度档位变化"
        - $formkit: menuRadio
          id: menu
          name: menu
          label: 菜单
          value: ""
          help: "选择菜单"
    - group: style
      label: 样式
      formSchema:
        - $formkit: group
          name: themeColor
          label: 主题颜色
          value:
            hue: 250
            fixed: false
          children:
            - $formkit: number
              name: hue
              min: 0
              max: 360
              step: 5
              label: 色调
              value: 250
              help: "主题颜色的默认色调，从0到360。红色：0，蓝绿色：200，青色：250，粉红色：345"
            - $formkit: switch
              name: fixed
              label: 固定色调
              value: false
              help: "隐藏访问者的主题彩色选择器"
        - $formkit: group
          name: colorScheme
          label: 配色方案
          value:
            color_scheme: auto
            enable_change_color_scheme: true
          children:
            - $formkit: select
              name: color_scheme
              label: 默认配色
              value: auto
              options:
                - label: 跟随系统
                  value: auto
                - label: 深色
                  value: dark
                - label: 浅色
                  value: light
            - $formkit: switch
              name: enable_change_color_scheme
              id: enable_change_color_scheme
              label: 允许访客切换配色
              value: true
            - $formkit: group
              name: colorSchemeAnimation
              if: "$get(enable_change_color_scheme).value"
              label: 配色切换动画
              value:
                style: fade
                angle: 90
                easing: default
              children:
                - $formkit: select
                  name: style
                  id: style
                  label: 切换动画样式
                  value: fade
                  help: '已知 Mac 平台部分浏览器"圆形扩散"与"擦除"动画显示异常（圆心偏移、边缘残留、模糊丢失），建议使用淡入淡出以获得多平台更佳体验'
                  options:
                    - label: 淡入淡出
                      value: fade
                    - label: 圆形扩散
                      value: circle
                    - label: 擦除
                      value: wipe
                    - label: 无动画
                      value: none
                - $formkit: select
                  name: easing
                  label: 速度曲线
                  value: default
                  help: "过渡动画的缓动曲线：指数缓出扩散感强，回弹更活泼，线性最机械；动画时长随曲线自动匹配（不可单独设置）"
                  options:
                    - label: 默认
                      value: default
                    - label: 线性
                      value: linear
                    - label: 缓入
                      value: ease-in
                    - label: 缓出
                      value: ease-out
                    - label: 缓入缓出
                      value: ease-in-out
                    - label: 指数缓出
                      value: expo-out
                    - label: 回弹
                      value: back-out
                - $formkit: number
                  name: angle
                  id: angle
                  if: "$get(style).value === 'wipe'"
                  label: 擦除角度（度）
                  min: 0
                  max: 360
                  step: 15
                  value: 90
                  help: "仅擦除样式生效：0° 从左到右，90° 从上到下，180° 从右到左；未选擦除样式时隐藏该设置"
        - $formkit: group
          name: styleSwitches
          label: 样式开关
          value:
            # banner_wave 三选：disabled 关闭 / enabled 开启 / desktop_only 移动端关闭（触屏设备不加载动画）
            banner_wave: enabled
            navbar_blur: true
            card_hover_lift: true
          children:
            # 三选开关（写法与 color_scheme 一致）：关闭 / 开启 / 移动端关闭
            - $formkit: select
              name: banner_wave
              label: 底部波浪效果
              value: enabled
              help: "在 Banner 底部显示波浪过渡效果；移动端关闭指触屏设备不显示动画，可降低性能开销和加载时间"
              options:
                - label: 关闭
                  value: disabled
                - label: 开启
                  value: enabled
                - label: 移动端关闭
                  value: desktop_only
            - $formkit: switch
              name: navbar_blur
              label: 高级材质
              value: true
              help: "启用后导航栏等元素变为半透明磨砂模糊效果"
            - $formkit: switch
              name: card_hover_lift
              label: 卡片悬浮效果
              value: true
              help: "卡片悬停时轻微上移并显示主题色阴影"

        - $formkit: group
          name: floatingButtons
          label: 浮动导航按钮
          value:
            enable_back_to_top: true
            enable_back_to_home: true
            enable_back_to_comment: true
          children:
            - $formkit: switch
              name: enable_back_to_top
              label: 回到顶部
              value: true
              help: "显示右下角回到顶部按钮"
            - $formkit: switch
              name: enable_back_to_home
              label: 回到首页
              value: true
              help: "显示右下角回到首页按钮"
            - $formkit: switch
              name: enable_back_to_comment
              label: 跳转评论
              value: true
              help: "显示右下角跳转到评论区按钮"
            - $formkit: array
              name: customButtons
              label: 自定义按钮
              help: "自定义浮动按钮，按钮将显示在默认按钮上方"
              children:
                - $formkit: text
                  name: name
                  label: 按钮名称
                  validation: required
                - $formkit: iconify
                  name: icon
                  label: 图标
                  format: svg
                - $formkit: url
                  name: url
                  label: 跳转链接
                  validation: required
        - $formkit: group
          name: externalFont
          label: 外部字体
          value:
            enable: false
            family: ""
          children:
            - $formkit: switch
              name: enable
              id: externalFont_enable
              label: 启用外部字体
              value: false
              help: "使用第三方字体替换浏览器默认字体，当前仅支持全局替换"
            - $formkit: attachment
              name: fontFile
              if: "$get(externalFont_enable).value"
              label: 字体资源
              value: ""
              validation: required
              help: "上传字体文件（TTF/OTF/WOFF/WOFF2），或粘贴 Google Fonts 等 CSS 链接地址"
            - $formkit: text
              name: family
              if: "$get(externalFont_enable).value"
              label: font-family 名称
              value: ""
              validation: required
              help: "填写要应用的字体名称"
    - group: sidebar
      label: 侧边栏
      formSchema:
        - $formkit: group
          name: layout
          label: 页面布局
          children:
            - $formkit: select
              name: layoutMode
              id: layoutMode
              label: 页面布局样式
              value: three-column
              help: "选择页面的布局模式：两栏（仅左侧边栏）或三栏（左侧 + 右侧边栏）"
              options:
                - label: 两栏布局
                  value: two-column
                - label: 三栏布局
                  value: three-column
        - $formkit: group
          name: widgetsConfig
          label: 小组件设置
          children:
            - $formkit: array
              name: widgets
              label: 左侧边栏小部件
              value:
                - value: categories
                - value: tag
              children:
                - $formkit: select
                  name: value
                  id: widgets_value
                  label: 部件
                  options:
                    - label: 热门文章
                      value: popular-posts
                    - label: 文章分类
                      value: categories
                    - label: 文章标签
                      value: tag
                    - label: 音乐播放器
                      value: music
                    - label: 一言
                      value: hitokoto
                    - label: 站点统计
                      value: site-stats
                    - label: 天气
                      value: weather
                    - label: 最近日程
                      value: schedule
                    - label: 自定义HTML
                      value: html
                - $formkit: text
                  if: "$value.value === 'site-stats'"
                  name: site_start_date
                  label: 网站上线日期
                  value: ""
                  help: "用于计算运行天数，格式：YYYY-MM-DD，留空则不显示运行天数"
                - $formkit: text
                  if: "$value.value === 'weather'"
                  name: tencent_key
                  label: 腾讯位置服务 Key
                  value: ""
                  help: "WebService API 类型，免费注册：https://lbs.qq.com/dev/console/application/mine；Key 会在前端页面源码中明文出现，建议在腾讯位置服务控制台配置域名白名单"
                - $formkit: text
                  if: "$value.value === 'weather'"
                  name: default_city
                  label: 默认城市编码
                  value: "110000"
                  help: "IP定位失败时的回退城市，填写行政区划编码如 110000（北京）或 310000（上海）"
                - $formkit: url
                  if: "$value.value === 'hitokoto'"
                  name: api
                  label: 一言 API 地址
                  value: ""
                  help: "留空则使用内置默认一言 API（https://v1.hitokoto.cn/）"
                - $formkit: text
                  if: "$value.value === 'hitokoto'"
                  name: fallback_text
                  label: 获取失败文案
                  value: "世界很大，开心第一。"
                  help: "一言获取失败时显示的句子"
                - $formkit: text
                  if: "$value.value === 'hitokoto'"
                  name: fallback_source
                  label: 获取失败来源
                  value: "楠南NanNan"
                  help: "一言获取失败时显示的作者或来源"
                - $formkit: text
                  if: "$value.value === 'music'"
                  name: title
                  label: 标题
                  value: 音乐
                - $formkit: select
                  if: "$value.value === 'music'"
                  name: server
                  label: 平台
                  value: netease
                  options:
                    - label: 网易云音乐
                      value: netease
                    - label: QQ 音乐
                      value: tencent
                    - label: 酷狗音乐
                      value: kugou
                    - label: 虾米音乐
                      value: xiami
                    - label: 百度音乐
                      value: baidu
                - $formkit: select
                  if: "$value.value === 'music'"
                  name: type
                  label: 类型
                  value: playlist
                  options:
                    - label: 歌曲
