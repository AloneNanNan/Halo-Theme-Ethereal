apiVersion: v1alpha1
kind: Setting
metadata:
  name: Ethereal-setting
spec:
  forms:
    - group: layout
      label: 布局设置
      formSchema:
        - $formkit: group
          name: pageLayout
          label: 页面布局
          children:
            - $formkit: select
              name: layoutMode
              id: layoutMode
              label: 页面布局样式
              value: three-column
              help: "选择页面的布局模式：两栏（仅左侧边栏）或三栏（左侧 + 右侧边栏）"
              options:
                - label: 两栏布局
                  value: two-column
                - label: 三栏布局
                  value: three-column
            - $formkit: switch
              name: categoryBar
              id: categoryBar_enable
              key: categoryBar_enable
              label: 启用分类导航栏
              value: false
              help: "开启后将在内容区上方显示分类导航栏，包含首页、归档、文章分类及全部分类入口"
        - $formkit: group
          name: bannerLayout
          label: Banner 布局
          value:
            displayMode: banner
            wallpaperOpacity: 0.8
            wallpaperBlur: 10
            cardOpacity: 0.6
          children:
            - $formkit: select
              name: displayMode
              id: banner_displayMode
              label: 模式
              value: banner
              help: "关闭/纯色模式：不显示横幅，页面为纯色背景；横幅模式：非首页显示 35vh 横幅、首页延伸至 65vh；全屏模式：非首页同横幅模式，首页 banner 占满整屏（100vh）；全屏透明：无横幅、整屏壁纸作为页面背景，配合「高级材质」使内容与组件卡片磨砂透明"
              options:
                - label: 关闭/纯色模式
                  value: disabled
                - label: 横幅模式
                  value: banner
                - label: 全屏模式
                  value: fullscreen
                - label: 全屏透明
                  value: transparent
            - $formkit: number
              name: wallpaperOpacity
              id: banner_transparent_wallpaperOpacity
              key: banner_transparent_wallpaperOpacity
              if: "$get(banner_displayMode).value === 'transparent'"
              label: 壁纸透明度
              min: 0.3
              max: 1
              step: 0.05
              value: 0.8
              validation: "min:0.3|max:1"
              help: "壁纸整体不透明度（0.3~1，默认 0.8），调低后露出页面底色"
            - $formkit: number
              name: wallpaperBlur
              id: banner_transparent_wallpaperBlur
              key: banner_transparent_wallpaperBlur
              if: "$get(banner_displayMode).value === 'transparent'"
              label: 背景模糊度
              min: 0
              max: 24
              step: 1
              value: 10
              validation: "min:0|max:24"
              help: "壁纸背景模糊强度（0~24 px，默认 10），值越大越柔和；导航栏与悬浮按钮糊到的内容随之改变"
            - $formkit: number
              name: cardOpacity
              id: banner_transparent_cardOpacity
              key: banner_transparent_cardOpacity
              if: "$get(banner_displayMode).value === 'transparent'"
              label: 卡片透明度
              min: 0.3
              max: 1
              step: 0.05
              value: 0.6
              validation: "min:0.3|max:1"
              help: "内容/组件卡片、导航栏与悬浮按钮的半透明程度（0.3~1，默认 0.6），需同时开启「高级材质」"
        - $formkit: group
          name: postList
          label: 文章卡片布局
          value:
            defaultMode: list
            coverPosition: right
            descriptionLines: 2
            grid:
              masonry: false
              coverFullWidth: false
              coverAutoHeight: true
          children:
            - $formkit: select
              name: defaultMode
              id: postList_defaultMode
              label: 默认布局
              value: list
              help: "列表：单列布局，封面显示在卡片侧边；网格：多列布局，封面显示在卡片顶部"
              options:
                - label: 列表
                  value: list
                - label: 网格
                  value: grid
            - $formkit: select
              name: coverPosition
              id: postList_coverPosition
              key: postList_coverPosition
              if: "$get(postList_defaultMode).value === 'list'"
              label: 列表模式封面位置
              value: right
              help: "仅列表布局生效：封面显示在卡片右侧或左侧"
              options:
                - label: 右侧
                  value: right
                - label: 左侧
                  value: left
            - $formkit: number
              name: descriptionLines
              label: 简介显示行数
              value: 2
              min: 0
              max: 6
              step: 1
              help: "文章简介显示行数，设为 0 则不截断"
            - $formkit: group
              name: grid
              id: postList_grid
              key: postList_grid
              if: "$get(postList_defaultMode).value === 'grid'"
              label: 网格设置
              help: "以下设置仅网格布局生效"
              children:
                - $formkit: switch
                  name: masonry
                  id: postList_grid_masonry
                  key: postList_grid_masonry
                  label: 瀑布流
                  value: false
                  help: "开启后网格使用瀑布流（Masonry）布局：卡片高度参差不齐、错落排列，推荐有图无图混合时开启"
                - $formkit: switch
                  name: coverFullWidth
                  key: postList_grid_coverFullWidth
                  label: 封面贴边
                  value: false
                  help: "开启后封面撑满卡片顶部贴边（仅上两角圆角）；关闭则封面按内边距内缩，四角圆角"
                # 注：瀑布流下该开关隐藏（if），隐藏字段不持久化——开启再关闭瀑布流后
                # 会恢复为默认 true。瀑布流本就不参与等高，此重置无实际影响，可接受
                - $formkit: switch
                  name: coverAutoHeight
                  key: postList_grid_coverAutoHeight
                  if: "$get(postList_grid_masonry).value !== true"
                  label: 封面高度自适应
                  value: true
                  help: "开启后封面自动拉伸填满卡片剩余高度，等高网格下同排卡片封面等高、摘要下方不留白；关闭后封面固定 2:1 高度，摘要下方留白（仅等高网格生效，瀑布流下自动隐藏）"
        - $formkit: group
          name: mobileMenu
          label: 菜单栏设置
          value:
            style: accordion
          children:
            - $formkit: attachment
              name: logo
              label: 菜单栏 Logo
              value: ""
              help: "自定义菜单栏左侧 Logo 图片，留空使用主题默认图标。建议上传透明背景图片（高度约 28px），会等比缩放显示"
            - $formkit: menuSelect
              id: menu
              name: menu
              label: 菜单
              value: ""
              help: "选择导航栏展示的菜单，留空使用系统主菜单"
            - $formkit: select
              name: style
              id: mobileMenu_style
              key: mobileMenu_style
              label: 移动端菜单样式
              value: accordion
              help: "手风琴：从菜单栏下方展开下拉面板，带子菜单手风琴折叠；抽屉：从右侧滑出的圆角卡片，子菜单平铺展示"
              options:
                - label: 手风琴样式
                  value: accordion
                - label: 抽屉样式
                  value: drawer
            - $formkit: switch
              name: navbarFixed
              id: navbarFixed
              label: 固定菜单栏
              value: false
              help: "开启后桌面端菜单栏始终固定在页面顶部，滚动页面时不会自动收起（移动端默认始终固定）"
            - $formkit: switch
              name: enable_change_language
              id: enable_change_language
              label: 语言切换
              value: true
              help: "开启后在菜单栏显示语言切换按钮，访客可切换简体中文 / 繁體中文 / English；关闭则按「主题语言」的默认语言显示。注：切换会同步后台界面语言"
            - $formkit: switch
              name: enable_change_color_scheme
              id: enable_change_color_scheme
              label: 配色（深浅色）切换
              value: true
              help: "开启后在菜单栏显示明暗配色切换按钮，访客可切换深浅色；关闭后隐藏按钮，按「配色方案」中的默认配色显示"
            - $formkit: group
              name: visitorStyle
              label: 访客样式切换
              value:
                enable: true
                hue: true
                postListLayout: true
                cardStyle: true
                wallpaperMode: true
                wallpaperSettings: true
                transparent: true
              children:
                - $formkit: switch
                  name: enable
                  id: visitorStyle_enable
                  key: visitorStyle_enable
                  label: 允许访客切换样式
                  value: true
                  help: "总开关：开启后访客可在导航栏显示设置面板中切换下列样式；关闭则不显示任何样式切换开关"
                - $formkit: switch
                  name: hue
                  id: visitorStyle_hue
                  key: visitorStyle_hue
                  if: "$get(visitorStyle_enable).value"
                  label: 主题色相切换
                  value: true
                  help: "访客可在面板中调节主题色相；关闭则隐藏色相选择器，固定为主题颜色中设置的色调"
                - $formkit: switch
                  name: postListLayout
                  id: visitorStyle_postListLayout
                  key: visitorStyle_postListLayout
                  if: "$get(visitorStyle_enable).value"
                  label: 文章布局切换
                  value: true
                  help: "访客可在列表 / 网格布局间切换，后台「文章卡片布局」的默认模式仍作为初始值"
                - $formkit: switch
                  name: cardStyle
                  id: visitorStyle_cardStyle
                  key: visitorStyle_cardStyle
                  if: "$get(visitorStyle_enable).value"
                  label: 卡片样式切换
                  value: true
                  help: "访客可开关卡片悬浮效果、高级材质（磨砂）与瀑布流，后台「样式开关」的值仍作为默认"
                - $formkit: switch
                  name: wallpaperMode
                  id: visitorStyle_wallpaperMode
                  key: visitorStyle_wallpaperMode
                  if: "$get(visitorStyle_enable).value"
                  label: 壁纸模式切换
                  value: true
                  help: "访客可在纯色背景 / 横幅 / 全屏 / 全屏透明四种模式间切换，后台「横幅布局」的显示模式仍作为默认"
                - $formkit: switch
                  name: wallpaperSettings
                  id: visitorStyle_wallpaperSettings
                  key: visitorStyle_wallpaperSettings
                  if: "$get(visitorStyle_enable).value"
                  label: 壁纸设置切换
                  value: true
                  help: "横幅 / 全屏模式下，访客可开关横幅底部波浪动效；后台「样式开关」的波浪设置仍作为默认，后台关闭时前台不显示该开关"
                - $formkit: switch
                  name: transparent
                  id: visitorStyle_transparent
                  key: visitorStyle_transparent
                  if: "$get(visitorStyle_enable).value"
                  label: 透明设置调节
                  value: true
                  help: "仅横幅「全屏透明」模式下显示，访客可调节壁纸透明度 / 模糊度 / 卡片透明度"
        - $formkit: group
          name: floatingButtons
          label: 浮动导航按钮
          value:
            enable_back_to_top: true
            enable_back_to_home: true
            enable_back_to_comment: true
            enable_toc: true
          children:
            - $formkit: switch
              name: enable_back_to_top
              label: 回到顶部
              value: true
              help: "显示右下角回到顶部按钮"
            - $formkit: switch
              name: enable_back_to_home
              label: 回到首页
              value: true
              help: "显示右下角回到首页按钮"
            - $formkit: switch
              name: enable_back_to_comment
              label: 跳转评论
              value: true
              help: "显示右下角跳转到评论区按钮"
            - $formkit: switch
              name: enable_toc
              label: 目录按钮
              value: true
              help: "页面无可见目录（两栏悬浮目录 / 三栏右侧栏目录）时，显示右下角目录按钮，点击呼出目录弹窗，主要面向移动端与平板端"
            - $formkit: array
              name: customButtons
              label: 自定义按钮
              help: "自定义浮动按钮，按钮将显示在默认按钮上方"
              children:
                - $formkit: text
                  name: name
                  label: 按钮名称
                  validation: required
                - $formkit: iconify
                  name: icon
                  label: 图标
                  format: svg
                - $formkit: url
                  name: url
                  label: 跳转链接
                  validation: required
        - $formkit: group
          name: welcome
          label: 欢迎弹窗
          value:
            enable: false
            position: bottom-right
            title: "欢迎来到我的博客！"
            template: "来自 {location} 的小伙伴，很高兴遇见你！"
            fallbackLocation: "未知星球"
          children:
            - $formkit: switch
              name: enable
              id: welcome_enable
              key: welcome_enable
              label: 启用
              value: false
              help: "开启后访客进入网站时显示欢迎弹窗；访客关闭后本次会话不再弹出。IP 定位复用天气小组件配置的腾讯位置服务 Key，在侧边栏设置中点击「天气」小组件,配置 Key 后生效。"
            - $formkit: select
              name: position
              id: welcome_position
              key: welcome_position
              if: "$get(welcome_enable).value"
              label: 弹窗位置
              value: bottom-right
              help: "电脑端弹窗显示在所选角落；移动端固定显示在底部居中"
              options:
                - label: 左上角
                  value: top-left
                - label: 右上角
                  value: top-right
                - label: 左下角
                  value: bottom-left
                - label: 右下角
                  value: bottom-right
            - $formkit: text
              name: title
              if: "$get(welcome_enable).value"
              label: 欢迎标题
              value: "欢迎来到我的博客！"
              help: "弹窗标题文字"
            - $formkit: textarea
              name: template
              if: "$get(welcome_enable).value"
              label: 欢迎语模板
              value: "来自 {location} 的小伙伴，很高兴遇见你！"
              help: "弹窗正文，{location} 会替换为访客 IP 定位（如：北京市）；未配置 Key 或定位失败时替换为下方的降级文案"
            - $formkit: text
              name: fallbackLocation
              if: "$get(welcome_enable).value"
              label: 定位失败文案
              value: "未知星球"
              help: "未配置腾讯位置服务 Key 或定位失败时，替换 {location} 的地点文字（请填写地点名词，如：未知星球）。模板为「来自 {location} 的小伙伴」时，将显示「来自未知星球的小伙伴」"
    - group: style
      label: 样式设置
      formSchema:
        - $formkit: group
          name: bannerStyle
          label: Banner 样式
          value:
            mode: single
            src: "/themes/Ethereal/assets/images/demo-banner.png"
            carousel:
              images: []
              effect: fade
              dots: true
              preloadCount: 1
              dwellMs: 5000
            position: "center"
            credit:
              enable: false
              text: "© 2022 Ethereal"
              url: ""
          children:
            - $formkit: select
              name: mode
              id: banner_mode
              label: 类型
              value: single
              help: "单图/视频：显示一张图片或视频，按文件类型自动识别；多图轮播：多张静态图片循环切换"
              options:
                - label: 单图/视频
                  value: single
                - label: 多图轮播
                  value: carousel
            - $formkit: attachment
              name: src
              id: banner_src
              key: banner_src
              if: "$get(banner_mode).value === 'single'"
              label: 图片/视频
              value: "/themes/Ethereal/assets/images/demo-banner.png"
              accepts:
                - "image/*"
                - "video/mp4"
                - "video/webm"
              help: "支持图片（含 GIF/WebP/APNG 动图）与视频（MP4/WebM，静音循环播放）"
            - $formkit: switch
              name: showPauseBtn
              id: banner_showPauseBtn
              key: banner_showPauseBtn
              if: "$get(banner_mode).value === 'single'"
              label: 显示暂停按钮
              value: true
              help: "视频模式下在右下角显示播放/暂停按钮；关闭后视频仅自动静音循环播放，无手动控制（移动端同样生效）"
            - $formkit: group
              name: carousel
              id: banner_carousel
              key: banner_carousel
              if: "$get(banner_mode).value === 'carousel'"
              label: 轮播设置
              value:
                images: []
                effect: fade
                dots: true
                preloadCount: 1
                dwellMs: 5000
              children:
                - $formkit: attachment
                  name: images
                  id: carousel_images
                  key: carousel_images
                  label: 轮播图片
                  multiple: true
                  accepts:
                    - "image/*"
                  value: []
                  help: "选择多张静态图片，按顺序循环切换；少于 2 张时按单图显示。支持外部链接，重复链接会自动附加查询参数强制单独请求；随机图接口建议使用无状态服务（uapis.cn 等接口存在同一浏览器会话内反复请求返回同一张图的问题"
                - $formkit: select
                  name: effect
                  label: 切换效果
                  value: fade
                  options:
                    - label: 淡入淡出
                      value: fade
                    - label: 左右滑动
                      value: slide
                - $formkit: switch
                  name: dots
                  label: 显示指示点
                  value: true
                  help: "在右下角显示可点击的指示点，点击可跳转到对应图片"
                - $formkit: number
                  name: preloadCount
                  label: 预加载数量
                  min: 0
                  max: 10
                  step: 1
                  value: 1
                  help: "预加载当前图片之后的 N 张，0 表示不预加载"
                - $formkit: number
                  name: dwellMs
                  label: 停留时长（毫秒）
                  min: 1000
                  max: 60000
                  step: 500
                  value: 5000
                  help: "每张图片停留时长（毫秒），独立配置，不随动画速度档位变化；切换动画时长仍跟随动画速度档位"
            - $formkit: switch
              name: useMobileSrc
              id: banner_useMobileSrc
              label: 移动端独立来源
              value: false
              help: "开启后为移动端（小于 768px）单独设置 banner 视频/图片来源；关闭时两端共用同一来源"
            - $formkit: group
              name: mobile
              id: banner_mobile
              key: banner_mobile
              if: "$get(banner_useMobileSrc).value"
              label: 移动端设置
              value:
                mode: single
                src: ""
                images: []
              children:
                - $formkit: select
                  name: mode
                  id: banner_mobile_mode
                  label: 类型（移动端）
                  value: single
                  help: "移动端展示形态，可与电脑端不同（如电脑端视频、移动端图片）；行为设置（切换效果/指示点/停留时长/位置等）沿用电脑端"
                  options:
                    - label: 单图/视频
                      value: single
                    - label: 多图轮播
                      value: carousel
                - $formkit: attachment
                  name: src
                  id: banner_mobile_src
                  key: banner_mobile_src
                  if: "$get(banner_useMobileSrc).value && $get(banner_mobile_mode).value === 'single'"
                  label: 图片/视频（移动端）
                  value: ""
                  accepts:
                    - "image/*"
                    - "video/mp4"
                    - "video/webm"
                  help: "移动端单图/视频；留空则移动端使用电脑端来源"
                - $formkit: attachment
                  name: images
                  id: banner_mobile_images
                  key: banner_mobile_images
                  if: "$get(banner_useMobileSrc).value && $get(banner_mobile_mode).value === 'carousel'"
                  label: 轮播图片（移动端）
                  multiple: true
                  accepts:
                    - "image/*"
                  value: []
                  help: "移动端轮播图片，按顺序循环切换；留空则移动端使用电脑端来源。外部随机图接口建议使用无状态服务，uapis.cn 等接口存在同会话返回同一张图的问题"
            - $formkit: select
              name: position
              label: 位置
              value: "center"
              options:
                - value: center
                  label: 居中
                - value: top
                  label: 顶部
                - value: bottom
                  label: 底部
            - $formkit: group
              name: credit
              label: 版权信息
              children:
                - $formkit: switch
                  name: enable
                  label: 启用
                  value: false
                  help: "启用版权信息"
                - $formkit: text
                  name: text
                  label: 文字
                  value: "© 2022 Ethereal"
                  help: "显示的文字"
                - $formkit: url
                  name: url
                  label: 链接
                  value:
        - $formkit: group
          name: bannerText
          label: 标题与副标题
          value:
            enable: true
            title: "Hello,Ethereal!"
            titleFontSize: "3.5rem"
            subtitles: "生而为人，爱而无畏\n心之所向，素履以往\n保持热爱，奔赴山海"
            subtitleFontSize: "1.5rem"
            subtitleEffect: "typewriter"
          children:
            - $formkit: switch
              name: enable
              id: bannerText_enable
              label: 启用
              value: true
              help: "在 Banner 上显示标题和副标题"
            - $formkit: text
              name: title
              if: "$get(bannerText_enable).value"
              label: 标题
              value: "Hello,Ethereal!"
              help: "Banner 中间显示的标题文字"
            - $formkit: text
              name: titleFontSize
              if: "$get(bannerText_enable).value"
              label: 标题字号
              value: "3.5rem"
              help: "标题字体大小，支持 CSS 单位（如 3.5rem、48px）"
            - $formkit: textarea
              name: subtitles
              if: "$get(bannerText_enable).value"
              label: 副标题
              value: "生而为人，爱而无畏\n心之所向，素履以往\n保持热爱，奔赴山海"
              help: "每行一条文本，将循环展示"
            - $formkit: text
              name: subtitleFontSize
              if: "$get(bannerText_enable).value"
              label: 副标题字号
              value: "1.5rem"
              help: "副标题字体大小，支持 CSS 单位（如 1.5rem、20px）"
            - $formkit: select
              name: subtitleEffect
              if: "$get(bannerText_enable).value"
              label: 副标题动效
              value: "typewriter"
              options:
                - value: typewriter
                  label: 打字机效果
                - value: drop
                  label: 文字下坠
        - $formkit: group
          name: themeColor
          label: 主题颜色
          value:
            hue: 250
          children:
            - $formkit: number
              name: hue
              min: 0
              max: 360
              step: 5
              label: 色调
              value: 250
              help: "主题颜色的默认色调，从0到360。红色：0，蓝绿色：200，青色：250，粉红色：345"
        - $formkit: group
          name: colorScheme
          label: 配色方案
          value:
            color_scheme: auto
          children:
            - $formkit: select
              name: color_scheme
              label: 默认配色
              value: auto
              options:
                - label: 跟随系统
                  value: auto
                - label: 深色
                  value: dark
                - label: 浅色
                  value: light
            - $formkit: group
              name: colorSchemeAnimation
              label: 配色切换动画
              value:
                style: fade
                angle: 90
                easing: default
              children:
                - $formkit: select
                  name: style
                  id: style
                  label: 切换动画样式
                  value: fade
                  help: '已知 Mac 平台部分浏览器"圆形扩散"与"擦除"动画显示异常（圆心偏移、边缘残留、模糊丢失），建议使用淡入淡出以获得多平台更佳体验；需开启菜单栏设置中的「配色（深浅色）切换」开关后生效'
                  options:
                    - label: 淡入淡出
                      value: fade
                    - label: 圆形扩散
                      value: circle
                    - label: 擦除
                      value: wipe
                    - label: 无动画
                      value: none
                - $formkit: select
                  name: easing
                  label: 速度曲线
                  value: default
                  help: "过渡动画的缓动曲线：指数缓出扩散感强，回弹更活泼，线性最机械；动画时长随曲线自动匹配（不可单独设置）"
                  options:
                    - label: 默认
                      value: default
                    - label: 线性
                      value: linear
                    - label: 缓入
                      value: ease-in
                    - label: 缓出
                      value: ease-out
                    - label: 缓入缓出
                      value: ease-in-out
                    - label: 指数缓出
                      value: expo-out
                    - label: 回弹
                      value: back-out
                - $formkit: number
                  name: angle
                  id: angle
                  if: "$get(style).value === 'wipe'"
                  label: 擦除角度（度）
                  min: 0
                  max: 360
                  step: 15
                  value: 90
                  help: "仅擦除样式生效：0° 从左到右，90° 从上到下，180° 从右到左；未选擦除样式时隐藏该设置"
        - $formkit: group
          name: language
          label: 主题语言
          value:
            defaultLanguage: auto
          children:
            - $formkit: select
              name: defaultLanguage
              id: defaultLanguage
              key: defaultLanguage
              label: 默认语言
              value: auto
              help: "访客未手动切换时的默认语言：跟随系统按浏览器语言显示；固定为某语言时首次访问即按该语言渲染。注：切换会同步后台界面语言"
              options:
                - label: 跟随系统
                  value: auto
                - label: 简体中文
                  value: zh-CN
                - label: 繁體中文
                  value: zh-TW
                - label: English
                  value: en
        - $formkit: group
          name: styleSwitches
          label: 样式开关
          value:
            # banner_wave 三选：disabled 关闭 / enabled 开启 / desktop_only 移动端关闭（触屏设备不加载动画）
            banner_wave: enabled
            navbar_blur: true
            card_hover_lift: true
          children:
            # 三选开关（写法与 color_scheme 一致）：关闭 / 开启 / 移动端关闭
            - $formkit: select
              name: banner_wave
              label: 底部波浪效果
              value: enabled
              help: "在 Banner 底部显示波浪过渡效果；移动端关闭指触屏设备不显示动画，可降低性能开销和加载时间"
              options:
                - label: 关闭
                  value: disabled
                - label: 开启
                  value: enabled
                - label: 移动端关闭
                  value: desktop_only
            - $formkit: switch
              name: navbar_blur
              label: 高级材质
              value: true
              help: "启用后导航栏等元素变为半透明磨砂模糊效果；同时开启 banner「全屏透明」模式时，内容与组件卡片也会变为磨砂透明"
            - $formkit: switch
              name: card_hover_lift
              label: 卡片悬浮效果
              value: true
              help: "卡片悬停时轻微上移并显示主题色阴影"
        - $formkit: group
          name: animationSpeed
          label: 动画速度
          value:
            speedTier: balanced
          children:
            - $formkit: select
              name: speedTier
              id: speedTier
              label: 速度档位
              value: balanced
              help: "舒缓：保留完整错峰入场演出；均衡：当前主题原值；疾速：入场只做轻微位移、内容立即可见（换页时长随之缩短）；自定义：手动逐项设置各动画时长（不涉及主题切换动画，其仍随缓动曲线匹配）"
              options:
                - label: 舒缓
                  value: relaxed
                - label: 均衡
                  value: balanced
                - label: 疾速
                  value: snappy
                - label: 自定义
                  value: custom
            - $formkit: group
              name: speedCustom
              if: "$get(speedTier).value === 'custom'"
              label: 自定义动画时长
              help: "仅在速度档位选择「自定义」时展示；单位毫秒"
              value:
                swup: 200
                entry: 300
                entryStep: 50
                entryMax: 400
                contentDelay: 150
                scroll: 700
                float: 350
                banner: 700
                carouselTransition: 700
              children:
                - $formkit: number
                  name: swup
                  label: 换页退场（ms）
                  min: 0
                  max: 1000
                  step: 10
                  value: 200
                  help: "页面切换时旧内容淡出下移的时长（原 200ms）"
                - $formkit: number
                  name: entry
                  label: 入场动画（ms）
                  min: 0
                  max: 1000
                  step: 10
                  value: 300
                  help: "换页后新内容 fade-in-up 时长（原 300ms）"
                - $formkit: number
                  name: entryStep
                  label: 错峰步长（ms）
                  min: 0
                  max: 200
                  step: 10
                  value: 50
                  help: "列表/组件逐项入场的递增值（原 50ms），0 表示无错峰"
                - $formkit: number
                  name: entryMax
                  label: 错峰上限（ms）
                  min: 0
                  max: 1000
                  step: 10
                  value: 400
                  help: "入场延迟最大值（原 banner-credit 400ms），错峰超过此值被截断"
                - $formkit: number
                  name: contentDelay
                  label: 内容基础延迟（ms）
                  min: 0
                  max: 1000
                  step: 10
                  value: 150
                  help: "内容主区块的入场延迟（原 --content-delay 150ms）"
                - $formkit: number
                  name: scroll
                  label: 导航栏隐藏（ms）
                  min: 0
                  max: 2000
                  step: 50
                  value: 700
                  help: "下滑隐藏导航栏的时长（原 700ms）"
                - $formkit: number
                  name: float
                  label: 浮动按钮位移（ms）
                  min: 0
                  max: 1000
                  step: 10
                  value: 350
                  help: "回顶/首页/评论浮动按钮位移动画时长（原 350ms）"
                - $formkit: number
                  name: banner
                  label: Banner 载入（ms）
                  min: 0
                  max: 2000
                  step: 50
                  value: 700
                  help: "首屏 banner 图载入渐显时长（原 700ms）"
                - $formkit: number
                  name: carouselTransition
                  label: 轮播切换（ms）
                  min: 0
                  max: 2000
                  step: 10
                  value: 700
                  help: "轮播图切换动画时长（原 700ms），随动画速度档位变化"
        - $formkit: group
          name: externalFont
          label: 外部字体
          value:
            enable: false
            family: ""
          children:
            - $formkit: switch
              name: enable
              id: externalFont_enable
              label: 启用外部字体
              value: false
              help: "使用第三方字体替换浏览器默认字体，当前仅支持全局替换"
            - $formkit: attachment
              name: fontFile
              if: "$get(externalFont_enable).value"
              label: 字体资源
              value: ""
              validation: required
              help: "上传字体文件（TTF/OTF/WOFF/WOFF2），或粘贴 Google Fonts 等 CSS 链接地址"
            - $formkit: text
              name: family
              if: "$get(externalFont_enable).value"
              label: font-family 名称
              value: ""
              validation: required
              help: "填写要应用的字体名称"
