                      name: location
                      label: 地点
                    - $formkit: text
                      name: organization
                      label: 组织 / 机构
                    - $formkit: text
                      name: position
                      label: 职位 / 角色
                    - $formkit: textarea
                      name: skills
                      label: 技能标签
                      help: "每行一个"
                    - $formkit: textarea
                      name: achievements
