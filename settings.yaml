            owner_description: "这是一个基于 Halo 搭建的个人博客"
            owner_url: "https://example.com"
            owner_rss: "https://example.com/rss.xml"
          children:
            - $formkit: text
              name: owner_avatar
              label: 博客头像
              value: https://example.com/avatar.jpg
              help: "博客头像图片地址"
            - $formkit: text
              name: owner_name
              label: 博客名称
              value: 博客名称
              help: "博客名称"
            - $formkit: textarea
              name: owner_description
              label: 博客描述
              value: 这是一个基于 Halo 搭建的个人博客
              help: "博客简短描述"
            - $formkit: text
              name: owner_url
              label: 博客网址
              value: https://example.com
              help: "博客首页地址"
            - $formkit: text
              name: owner_rss
              label: RSS 地址
              value: https://example.com/rss.xml
              help: "博客 RSS 订阅地址"
        - $formkit: group
          name: applyFlow
          label: 申请友链流程
          children:
            - $formkit: array
              name: applySteps
              label: 申请步骤
              help: "自定义申请友链的步骤，最多5步，支持HTML。填写几个就显示几个步骤"
              max: 5
              value:
                - title: "添加本站友链"
                  desc: "请先在您的网站友链页面<strong>添加本站信息</strong>，可直接复制左侧各字段"
                - title: "评论留言"
                  desc: "在本页下方评论区留言提交申请"
                - title: "等待审核"
                  desc: "确认信息无误后会尽快添加您的友链"
              children:
                - $formkit: text
                  name: title
                  label: 步骤标题
                  validation: required
                - $formkit: textarea
                  name: desc
                  label: 步骤说明 (支持HTML)
                  validation: required
        - $formkit: group
          name: accordionPanel
          label: 折叠面板
          children:
            - $formkit: array
              name: accordions
              label: 面板项
              help: "自定义折叠面板，支持 HTML。"
              value:
                - title: "友链须知"
                  content: |
                    <ul>
                    <li>请先在您的网站添加本站信息</li>
                    <li>网站能够正常访问，使用HTTPS</li>
                    <li>网站符合中国大陆法律法规</li>
                    </ul>
                - title: "免责申明"
                  content: |
                    <ul>
                    <li>本博客严格遵守中华人民共和国法律法规，友情链接及其他外链，仅为了方便学习与交流而收集整理</li>
                    <li>本人能力有限，无法逐一甄别每篇文章的全部内容，也无法实时跟进并确认原作者后续是否对链接内容进行篡改，包括但不限于发布违法信息、植入恶意代码、诱导点击或破坏用户计算机等行为</li>
                    </ul>
              children:
                - $formkit: text
                  name: title
                  label: 面板标题
                  validation: required
                - $formkit: iconify
                  name: icon
                  label: 图标
                  format: svg
                - $formkit: textarea
                  name: content
                  label: 正文 (支持HTML)
                  validation: required
    - group: external_link
      label: 外链跳转
      formSchema:
        - $formkit: switch
          name: enable_redirect
          id: redirect_enable
          label: 启用外链跳转提示
          value: true
          help: "开启后点击外部链接时显示跳转提示页面"
        - $formkit: number
          name: redirect_delay
          if: "$get(redirect_enable).value"
          label: 自动跳转时间（秒）
          min: 0
          max: 30
          step: 1
          value: 5
          help: "设置为 0 则禁用自动跳转"
        - $formkit: textarea
          name: redirect_prompt
          if: "$get(redirect_enable).value"
          label: 自定义提示文本
          value: "您即将访问外部链接，请注意保护个人隐私和信息安全"
          help: "自定义外链跳转模态框中显示的提示语句"
        - $formkit: attachment
          name: avatar
          if: "$get(redirect_enable).value"
          label: 提示页头像
          help: "留空则使用默认图标"
        - $formkit: textarea
          name: whitelist
          if: "$get(redirect_enable).value"
          label: 域名白名单
          value: ""
          help: "白名单内的域名不显示跳转提示，直接跳转。每行一个域名，支持通配符如 *.example.com"
        - $formkit: switch
          name: open_new_window
          if: "$get(redirect_enable).value"
          label: 新窗口打开
          value: true
          help: "开启后将在新标签页打开外部链接"
    - group: performance
      label: 速度优化
      formSchema:
        - $formkit: group
          name: imageProcessing
          label: 图片处理
          value:
            provider: none
            card_cover_width: 400
            article_image_width: 1200
            custom_format: ""
            banner_width: 1920
            avatar_size: 512
          children:
            - $formkit: select
              name: provider
              id: image_processing_provider
              label: 图片处理服务
              value: none
              help: "选择你的图片存储/CDN 服务，以启用实时图片压缩缩放。此功能会对文章封面图和文章内图片进行分辨率压缩处理，以便达到速度优化效果。\n如果图片存储在非halo内部存储，需在对应服务端开启图片处理功能。\n建议值仅供参考，以实际显示效果自主调试为准。\n此功能测试中，无法保证所有功能正常，如有问题请反馈。"
              options:
                - label: 不处理（使用原图）
                  value: none
                - label: Halo 内置附件存储
                  value: halo
                - label: 阿里云 ESA / DCDN
                  value: aliyun_esa
                - label: 阿里云 OSS
                  value: aliyun_oss
                - label: 腾讯云 EdgeOne
                  value: tencent_eo
                - label: 腾讯云 COS（数据万象）
                  value: tencent_cos
                - label: 七牛云
                  value: qiniu
                - label: 又拍云
                  value: upyun
                - label: 自定义
                  value: custom
            - $formkit: text
              name: custom_format
              if: "$get(image_processing_provider).value === 'custom'"
              label: 自定义参数格式
              value: ""
              help: "使用 {width} 作为宽度占位符。例如：?image_process=resize,w_{width}"
            - $formkit: number
              name: card_cover_width
              if: "$get(image_processing_provider).value !== 'none'"
              label: 首页卡片封面宽度 (px)
              value: 400
              min: 0
              max: 2000
              step: 50
              help: "建议 300-800，设为 0 则使用原图不压缩。原图宽度不足时仅支持缩小"
            - $formkit: number
              name: article_image_width
              if: "$get(image_processing_provider).value !== 'none'"
              label: 文章页图片宽度 (px)
              value: 1200
              min: 0
              max: 2000
              step: 50
              help: "建议 800-2000，设为 0 则使用原图不压缩。当使用内部存储时仅处理文章封面图，正文图片宽度由系统自动优化；使用 CDN 时封面图与正文图片均生效。原图宽度不足时仅支持缩小"
            - $formkit: number
              name: banner_width
              if: "$get(image_processing_provider).value !== 'none'"
              label: Banner 图片宽度 (px)
              value: 1920
              min: 0
              max: 3840
              step: 160
              help: "Banner 图片的缩放宽度（px）。设为 0 则使用原图不压缩。建议值：1920"
            - $formkit: number
              name: avatar_size
              if: "$get(image_processing_provider).value !== 'none'"
              label: 头像尺寸 (px)
              value: 512
              min: 0
              max: 512
              step: 32
              help: "头像图片的缩放宽度（px）。设为 0 则使用原图不压缩。建议值：512"
    - group: auth
      label: 认证
      formSchema:
        - $formkit: select
          name: loginPage
          id: login_page
          label: 登录界面
          value: halo
          options:
            - label: 主题认证界面
              value: theme
            - label: Halo 默认
              value: halo
