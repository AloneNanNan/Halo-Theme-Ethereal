                  label: 链接文本
                  value: "了解更多"
                - $formkit: url
                  name: url
                  if: "$get(announcement_link_enable).value"
                  label: 链接地址
                  value: ""
                - $formkit: switch
                  name: external
                  if: "$get(announcement_link_enable).value"
                  label: 外部链接
                  value: false
                  help: "开启后在新标签页打开"
    - group: post
      label: 文章
      formSchema:
        - $formkit: group
          name: license
          label: 版权声明
          value:
            enable: false
            name: CC BY-NC-SA 4.0
            url: https://creativecommons.org/licenses/by-nc-sa/4.0/
          children:
            - $formkit: switch
              name: enable
              id: license_enable
              label: 启用
              value: false
              help: "启用版权声明"
            - $formkit: text
              name: name
              if: "$get(license_enable).value"
              label: 名称
              value: CC BY-NC-SA 4.0
            - $formkit: url
              name: url
              if: "$get(license_enable).value"
              label: 链接
              value: https://creativecommons.org/licenses/by-nc-sa/4.0/
        - $formkit: group
          name: contentDisplay
          label: 内容显示
          value:
            showCover: true
            content_size: prose-base
            content_theme: prose-gray
          children:
            - $formkit: switch
              name: showCover
              label: 显示封面图
              value: true
              help: "在文章页正文上方显示封面图；关闭后列表/卡片仍正常显示封面，仅文章页内不重复显示"
            - $formkit: select
              name: content_size
              label: 字体大小
              value: prose-base
              options:
                - value: prose-base
                  label: prose-base
                - value: prose-sm
                  label: prose-sm
                - value: prose-lg
                  label: prose-lg
                - value: prose-xl
                  label: prose-xl
                - value: prose-2xl
                  label: prose-2xl
            - $formkit: select
              name: content_theme
              label: 颜色主题
              value: prose-gray
              options:
                - value: prose-gray
                  label: prose-gray
                - value: prose-slate
                  label: prose-slate
                - value: prose-zinc
                  label: prose-zinc
                - value: prose-neutral
                  label: prose-neutral
                - value: prose-stone
                  label: prose-stone
        - $formkit: group
          name: toc
          label: 目录
          value:
            enable_toc: true
            toc_depth: 2
          children:
            - $formkit: switch
              name: enable_toc
              id: toc_enable
              label: 启用目录
              value: true
              help: "启用目录"
            - $formkit: number
              name: toc_depth
              if: "$get(toc_enable).value"
              label: 目录最大深度
              value: 2
              help: "目录的最大深度"
        - $formkit: group
          name: summary
          label: 文章摘要
          value:
            enable_summary: true
            summary_title: "文章摘要"
            summaryEffect: "typewriter"
          children:
            - $formkit: switch
              name: enable_summary
              id: summary_enable
              label: 启用文章摘要
              value: true
              help: "在文章页面封面图下方显示自定义摘要"
            - $formkit: text
              name: summary_title
              if: "$get(summary_enable).value"
              label: 摘要标题
              value: "文章摘要"
              help: "摘要框显示的标题文字，留空则不显示标题"
            - $formkit: select
              name: summaryEffect
              if: "$get(summary_enable).value"
              label: 摘要文字动效
              value: "typewriter"
              options:
                - value: typewriter
                  label: 打字机效果
                - value: drop
                  label: 文字下坠
        - $formkit: group
          name: actionBar
          label: 文章操作栏
          value:
            enable: true
            like: true
            share: true
            reward: true
            rewardSetting:
              title: "如果这篇文章对你有帮助，可以请我喝杯咖啡！"
              wechat_qr: ""
              alipay_qr: ""
          children:
            - $formkit: switch
              name: enable
              id: actionbar_enable
              label: 启用文章操作栏
              value: true
              help: "在文章版权声明上方显示点赞、分享、打赏操作卡片"
            - $formkit: switch
              name: like
              if: "$get(actionbar_enable).value"
              label: 启用点赞
              value: true
              help: "关闭后点赞图标仅展示、不可交互"
            - $formkit: switch
              name: share
              if: "$get(actionbar_enable).value"
              label: 启用分享
              value: true
              help: "显示分享按钮，点击生成分享海报"
            - $formkit: switch
              name: reward
              id: actionbar_reward
              if: "$get(actionbar_enable).value"
              label: 启用打赏
              value: true
              help: "显示打赏按钮，点击弹出微信/支付宝收款二维码"
            - $formkit: group
              name: rewardSetting
              label: 打赏设置
              if: "$get(actionbar_reward).value"
              value:
                title: "如果这篇文章对你有帮助，可以请我喝杯咖啡！"
                wechat_qr: ""
                alipay_qr: ""
              children:
                - $formkit: textarea
                  name: title
                  label: 打赏文案
                  value: "如果这篇文章对你有帮助，可以请我喝杯咖啡！"
                  help: "打赏弹窗顶部的自定义文案"
                - $formkit: attachment
                  name: wechat_qr
                  label: 微信收款码
                  accepts:
                    - "image/*"
                  aspectRatio: "1/1"
                  value: ""
                  help: "上传微信收款二维码图片（建议 1:1 正方形）"
                - $formkit: attachment
                  name: alipay_qr
                  label: 支付宝收款码
                  accepts:
                    - "image/*"
                  aspectRatio: "1/1"
                  value: ""
                  help: "上传支付宝收款二维码图片（建议 1:1 正方形）"
    - group: extendPages
