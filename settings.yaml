            closable: true
            link:
              enable: false
              text: "了解更多"
              url: ""
              external: false
          children:
            - $formkit: switch
              name: enable
              id: announcement_enable
              label: 启用公告
              value: false
              help: "开启后显示公告小组件（侧边栏首位为个人简介小组件时显示在第二位），不参与吸顶，随页面滚动"
