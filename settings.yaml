              name: position
              if: "$get(announcement_enable).value"
              label: 显示位置
              value: left
              help: "公告仅可显示在左侧边栏或右侧边栏，两栏布局时仅显示在左侧"
              options:
                - label: 左侧边栏
                  value: left
                - label: 右侧边栏
                  value: right
            - $formkit: textarea
              name: content
              if: "$get(announcement_enable).value"
              label: 公告内容
              value: "欢迎来到我的博客！这是一则示例公告。"
            - $formkit: switch
              name: closable
              if: "$get(announcement_enable).value"
              label: 允许关闭
              value: true
