                      help: "卡片图标，留空则按类型自动匹配"
                    - $formkit: color
                      name: color
                      label: 主题色
                      value: ""
                      help: "节点与卡片图标的颜色，留空使用主题色"
                    - $formkit: switch
                      name: featured
                      label: 精选
                      value: false
                      help: "开启后在标题旁显示星标"
        - $formkit: group
