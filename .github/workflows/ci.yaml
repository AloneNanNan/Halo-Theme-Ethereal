name: CI (Build & Release)

on:
  # 自动触发：push 到 main 且 theme.yaml 版本较上一提交增大合规时，构建并自动发布
  push:
    branches: [main]
  # 手动触发：输入 tag 发布到指定 Release；留空则仅构建并保存 artifact
  workflow_dispatch:
    inputs:
      publish-github:
        description: "是否发布到 GitHub Release（默认 true；false 时仅构建，不发布）"
        required: false
        type: boolean
        default: true
      tag:
        description: "发布到该 GitHub Release tag（publish-github=true 时必填）"
        required: false
        type: string
      sync-halo:
        description: "是否同步到 Halo 应用市场（默认 true；false 时注入跳过标记，cd.yaml 检测后跳过同步）"
        required: false
        type: boolean
        default: true

# 同一分支上重复触发时排队执行，避免并发构建竞争 Release 资产（上传以最后一次为准）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 总是运行（不再按事件跳过，避免静默跳过无法排障）：
  # push 事件检测版本是否增大；手动触发直接放行并输出说明
  version-check:
    name: 检测 theme.yaml 版本号
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      trigger: ${{ steps.check.outputs.trigger }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要 git 历史读取上一提交的版本号

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 版本检测 / 触发说明
        id: check
        run: |
          echo "触发事件: ${{ github.event_name }}"
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "::notice::手动触发（workflow_dispatch）：无需版本增大检测，直接构建"
            echo "trigger=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node scripts/check-version-bump.mjs; then
            echo "::notice::push 触发：版本较上一提交增大且合规，构建并自动发布"
            echo "trigger=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::push 触发：版本未增大或 semver 不合规，跳过构建（详见脚本输出）"
            echo "trigger=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & Release Theme
    needs: version-check
    # 手动触发时 trigger 恒为 true；push 时取决于版本检测结果
    if: needs.version-check.outputs.trigger == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 创建 tag 与 Release 需要
    steps:
      - uses: actions/checkout@v7

      # 排障日志：触发事件、手动触发参数、本次各发布步骤的执行决策
      - name: 运行参数与决策日志
        run: |
          echo "触发事件: ${{ github.event_name }}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "发布决策: 自动发布（tag 自动创建，版本检测已通过）"
            echo "步骤计划: 构建 → 质量门 → 自动创建 tag → 上传 Release（Halo 默认同步）"
          else
            echo "publish-github: ${{ github.event.inputs.publish-github }}"
            echo "tag: ${{ github.event.inputs.tag }}"
            echo "sync-halo: ${{ github.event.inputs.sync-halo }}"
            if [[ "${{ github.event.inputs.publish-github }}" == "false" ]]; then
              echo "发布决策: 已显式关闭 GitHub 发布 → 仅构建，不发布"
              echo "步骤计划: 构建 → 质量门 → artifact（无发布步骤）"
            else
              echo "发布决策: 发布到 GitHub Release"
              echo "步骤计划: 构建 → 质量门 → 校验 tag → 上传 Release（sync-halo=false 时注入跳过标记，Halo 不同步）"
            fi
          fi

      # 不指定 version，自动按 package.json 的 packageManager 字段安装 pnpm@10.33.0
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build & Package
        run: pnpm build

      # 质量门：独立可复用的 composite action（.github/actions/quality-gate）
      - name: 质量门校验
        uses: ./.github/actions/quality-gate

      - uses: actions/upload-artifact@v4
        with:
          name: ethereal-theme
          path: dist/*.zip
          if-no-files-found: error

      # 自动触发（push）：按 theme.yaml 的 version 自动创建 tag（远程已存在则跳过，幂等）
      - name: 自动创建 tag（push 触发）
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^[[:space:]]*version:' theme.yaml | sed -E 's/^[[:space:]]*version:[[:space:]]*["'\'']?([^"'\''[:space:]]+).*/\1/')
          [ -n "$VERSION" ] || { echo "::error::无法从 theme.yaml 解析 version 字段"; exit 1; }
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_ENV"
          if git ls-remote --tags origin "$TAG" | grep -q .; then
            echo "远程已存在 tag $TAG，跳过创建"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "已创建并推送 tag $TAG"
          fi

      # 手动触发：发布行为由显式开关决定（不靠 tag 填不填推断）
      # publish-github=false → 仅构建不发布；true → tag 必填并校验
      - name: 校验发布配置（手动触发）
        if: github.event_name == 'workflow_dispatch'
        run: |
          PUBLISH_GITHUB="${{ github.event.inputs.publish-github }}"
          if [[ "$PUBLISH_GITHUB" == "false" ]]; then
            echo "已显式关闭 GitHub 发布（publish-github=false），仅构建不发布"
            if [[ "${{ github.event.inputs.sync-halo }}" != "false" ]]; then
              echo "::warning::Halo 同步依赖 GitHub Release，publish-github=false 时一并忽略（如需同步请开启 GitHub 发布）"
            fi
            echo "publish=false" >> "$GITHUB_ENV"
            exit 0
          fi
          # 发布开启：tag 必须显式填写
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "::error::GitHub 发布已开启（publish-github=true）但未填写 tag；如需仅构建请将 publish-github 设为 false"
            exit 1
          fi
          if [[ "$TAG" != v* ]]; then
            echo "::error::Release tag 必须以 v 开头（如 v1.0.7），当前输入：$TAG"
            exit 1
          fi
          # version 位于 spec 嵌套层（如 spec.version），需容忍行首缩进
          VERSION=$(grep -m1 '^[[:space:]]*version:' theme.yaml | sed -E 's/^[[:space:]]*version:[[:space:]]*["'\'']?([^"'\''[:space:]]+).*/\1/')
          [ -n "$VERSION" ] || { echo "::error::无法从 theme.yaml 解析 version 字段"; exit 1; }
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag（$TAG）与 theme.yaml 版本（v$VERSION）不一致"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_ENV"
          echo "校验通过：tag $TAG 与 theme.yaml 版本一致"

      # 上传 zip 到 Release；不存在时自动创建（说明取 release.md），已存在时更新资产。
      # sync-halo=false 时在说明中注入隐藏标记 <!-- skip-halo-sync -->（页面不可见），
      # cd.yaml 检测到该标记即跳过 Halo 应用市场同步
      - name: 上传到 GitHub Release
        if: github.event_name == 'push' || env.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ env.tag }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          # 组装 Release 说明：release.md 内容；sync-halo=false 时追加跳过标记
          WRITE_NOTES=0
          if [[ "${{ github.event.inputs.sync-halo }}" == "false" ]]; then
            WRITE_NOTES=1
            printf '%s\n\n<!-- skip-halo-sync -->' "$(cat release.md 2>/dev/null)" > /tmp/release-notes.md
          elif [ -f release.md ]; then
            WRITE_NOTES=1
            cp release.md /tmp/release-notes.md
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            if [ "$WRITE_NOTES" = "1" ]; then
              gh release edit "$TAG" --notes-file /tmp/release-notes.md
            fi
            echo "已更新 Release $TAG 的资产"
          else
            if [ "$WRITE_NOTES" = "1" ]; then
              gh release create "$TAG" dist/*.zip --notes-file /tmp/release-notes.md
            else
              gh release create "$TAG" dist/*.zip
            fi
            echo "已创建 Release $TAG 并上传资产"
          fi
