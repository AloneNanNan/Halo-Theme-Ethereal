version: 2
updates:
  # GitHub Actions：自动更新 action 到最新大版本，按生态组合为一个 PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: chore
